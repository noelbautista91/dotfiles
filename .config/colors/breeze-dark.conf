# KDE Breeze Dark Color Palette
# Official color values from KDE Plasma Breeze Dark theme
# Last updated: 2025-11-12

# ============================================================================
# CORE UI COLORS
# ============================================================================

# Backgrounds
BREEZE_BG_NORMAL="#292C30"              # Main window background (41,44,48)
BREEZE_BG_ALTERNATE="#1E5774"           # Alternate background (30,87,116)
BREEZE_BG_VIEW="#14161B"                # View/content area (20,22,27)
BREEZE_BG_VIEW_ALT="#1D1F22"            # Alternate row background (29,31,34)
BREEZE_BG_BUTTON="#292C30"              # Button background (41,44,48)
BREEZE_WM_ACTIVE="#272C31"              # Active window titlebar (39,44,49)
BREEZE_WM_INACTIVE="#202428"            # Inactive window titlebar (32,36,40)

# Foregrounds
BREEZE_FG_NORMAL="#FCFCFC"              # Main text (252,252,252)
BREEZE_FG_INACTIVE="#A1A9B1"            # Inactive/secondary text (161,169,177)
BREEZE_FG_DISABLED="#383838"            # Disabled elements (56,56,56)

# ============================================================================
# ACCENT & INTERACTIVE COLORS
# ============================================================================

# Primary Accent - The signature Breeze blue
BREEZE_ACCENT="#3DAEE9"                 # Primary interactive color (61,174,233)
BREEZE_FOCUS="#3DAEE9"                  # Focus indicators
BREEZE_HOVER="#3DAEE9"                  # Hover state
BREEZE_ACTIVE="#3DAEE9"                 # Active element highlight

# Selection
BREEZE_SELECTION_BG="#3DAEE9"           # Selected item background
BREEZE_SELECTION_FG="#FCFCFC"           # Selected item text

# Links
BREEZE_LINK="#1D99F3"                   # Hyperlink text (29,153,243)
BREEZE_LINK_VISITED="#9B59B6"           # Visited link (155,89,182)

# ============================================================================
# SEMANTIC COLORS
# ============================================================================

# Success / Positive
BREEZE_SUCCESS="#27AE60"                # Success state (39,174,96)
BREEZE_SUCCESS_BG="#176839"             # Success background (23,104,57)

# Error / Negative
BREEZE_ERROR="#DA4453"                  # Error state (218,68,83)
BREEZE_ERROR_BG="#B03745"               # Error background (176,55,69)

# Warning / Neutral
BREEZE_WARNING="#F67400"                # Warning state (246,116,0)
BREEZE_WARNING_BG="#C65C00"             # Warning background (198,92,0)

# Information
BREEZE_INFO="#1D99F3"                   # Information (29,153,243)

# ============================================================================
