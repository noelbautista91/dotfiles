# Terminal Base
BREEZE_TERM_BG="#232627"                # Terminal background (35,38,39)
BREEZE_TERM_FG="#FCFCFC"                # Terminal foreground (252,252,252)

# Normal Colors (ANSI 0-7)
BREEZE_BLACK="#232627"                  # Color 0: Black (35,38,39)
BREEZE_RED="#ED1515"                    # Color 1: Red (237,21,21)
BREEZE_GREEN="#11D116"                  # Color 2: Green (17,209,22)
BREEZE_YELLOW="#F67400"                 # Color 3: Yellow (246,116,0)
BREEZE_BLUE="#1D99F3"                   # Color 4: Blue (29,153,243)
BREEZE_MAGENTA="#9B59B6"                # Color 5: Magenta (155,89,182)
BREEZE_CYAN="#1ABC9C"                   # Color 6: Cyan (26,188,156)
BREEZE_WHITE="#FCFCFC"                  # Color 7: White (252,252,252)

# Bright Colors (ANSI 8-15)
BREEZE_BRIGHT_BLACK="#7F8C8D"           # Color 8: Bright Black/Gray (127,140,141)
BREEZE_BRIGHT_RED="#C0392B"             # Color 9: Bright Red (192,57,43)
BREEZE_BRIGHT_GREEN="#1CDC9A"           # Color 10: Bright Green (28,220,154)
BREEZE_BRIGHT_YELLOW="#FDBC4B"          # Color 11: Bright Yellow (253,188,75)
BREEZE_BRIGHT_BLUE="#3DAEE9"            # Color 12: Bright Blue (61,174,233)
BREEZE_BRIGHT_MAGENTA="#8E44AD"         # Color 13: Bright Magenta (142,68,173)
BREEZE_BRIGHT_CYAN="#16A085"            # Color 14: Bright Cyan (22,160,133)
BREEZE_BRIGHT_WHITE="#FFFFFF"           # Color 15: Bright White (255,255,255)

# Faint/Dim Colors (for terminals supporting dim mode)
BREEZE_DIM_BLACK="#31363B"              # Dim black (49,54,59)
BREEZE_DIM_RED="#783228"                # Dim red (120,50,40)
BREEZE_DIM_GREEN="#17A262"              # Dim green (23,162,98)
BREEZE_DIM_YELLOW="#B65619"             # Dim yellow (182,86,25)
BREEZE_DIM_BLUE="#1B668F"               # Dim blue (27,102,143)
BREEZE_DIM_MAGENTA="#614A73"            # Dim magenta (97,74,115)
BREEZE_DIM_CYAN="#186C60"               # Dim cyan (24,108,96)
BREEZE_DIM_WHITE="#63686D"              # Dim white (99,104,109)

# ============================================================================
# UI ELEMENT COLORS
# ============================================================================

# Borders & Separators
BREEZE_BORDER="#31363B"                 # Default border color (49,54,59)
BREEZE_SEPARATOR="#31363B"              # Separator lines

# Cursor
BREEZE_CURSOR="#FCFCFC"                 # Cursor color
BREEZE_CURSOR_TEXT="#232627"            # Text under cursor

# ============================================================================
# COLOR USAGE GUIDE
# ============================================================================

# Backgrounds:
#   - Use BREEZE_BG_NORMAL (#292C30) for main application backgrounds
#   - Use BREEZE_TERM_BG (#232627) for terminal backgrounds
#   - Use BREEZE_BORDER (#31363B) for elevated/highlighted surfaces
#
# Text:
#   - Use BREEZE_FG_NORMAL (#FCFCFC) for primary text
#   - Use BREEZE_FG_INACTIVE (#A1A9B1) for secondary/helper text
#   - Use BREEZE_FG_DISABLED (#383838) for disabled text
#
# Interactive Elements:
#   - Use BREEZE_ACCENT (#3DAEE9) sparingly for primary actions
#   - Use focus/hover variations for interactive feedback
#
# Semantic Feedback:
#   - Green (#27AE60): Success, confirmation, positive actions
#   - Red (#DA4453): Errors, destructive actions, critical warnings
#   - Orange (#F67400): Warnings, caution, non-critical alerts
#   - Blue (#1D99F3 or #3DAEE9): Information, tips, neutral actions
#
# Terminal Applications:
#   - Use 16-color ANSI palette (BREEZE_BLACK through BREEZE_BRIGHT_WHITE)
#   - Map semantic colors: Success→Green, Error→Red, Warning→Yellow
#
# ============================================================================
