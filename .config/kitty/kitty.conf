font_family Hack
font_size 12.0
window_padding_width 8

# ============================================================================
# Breeze Dark Color Scheme
# Based on KDE Plasma Breeze Dark theme
# See .config/colors/breeze-dark.conf for full palette reference
# ============================================================================

# Base colors
foreground #FCFCFC
background #232627
selection_foreground #FCFCFC
selection_background #3DAEE9

# Cursor colors
cursor #FCFCFC
cursor_text_color #232627

# URL underline color when hovering
url_color #1D99F3

# Tab bar colors
active_tab_foreground #232627
active_tab_background #3DAEE9
inactive_tab_foreground #A1A9B1
inactive_tab_background #31363B
tab_bar_background #292C30

# Window border colors
active_border_color #3DAEE9
inactive_border_color #31363B

# Normal colors (ANSI 0-7)
color0 #232627
color1 #ED1515
color2 #11D116
color3 #F67400
color4 #1D99F3
color5 #9B59B6
color6 #1ABC9C
color7 #FCFCFC

# Bright colors (ANSI 8-15)
color8 #7F8C8D
color9 #C0392B
color10 #1CDC9A
color11 #FDBC4B
color12 #3DAEE9
color13 #8E44AD
color14 #16A085
color15 #FFFFFF

