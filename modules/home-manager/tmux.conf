# Breeze Dark theme
set -g pane-border-style fg='#31363B'
set -g pane-active-border-style fg='#3DAEE9'
set -g message-style fg='#3DAEE9',bg='#31363B'
set -g message-command-style fg='#31363B',bg='#3DAEE9'

# Status bar
set -g status-style bg='#31363B',fg='#eff0f1'
set -g status-interval 5
set -g status-left ''
set -g status-right-length 50
set -g status-right '#[fg=#31363B,bg=#3DAEE9] %Y-%m-%d #[fg=#31363B,bg=#3DAEE9] %H:%M '

# Window status
setw -g window-status-format '#[fg=#eff0f1,bg=#31363B] #I:#W '
setw -g window-status-current-format '#[fg=#31363B,bg=#3DAEE9,bold] #I:#W '

# Copy mode
setw -g mode-style fg='#eff0f1',bg='#3DAEE9'