# ============================================================================
# Breeze Dark Color Scheme
# See .config/colors/breeze-dark.conf for full palette reference
# ============================================================================

set -g mouse on

# Pane borders - inactive uses subtle gray, active uses Breeze blue
set -g pane-border-style fg=#31363B
set -g pane-active-border-style fg=#3DAEE9

# Status bar - matches Breeze Dark UI
set -g status-style bg=#31363B,fg=#FCFCFC

# Status bar content
set -g status-left ""
set -g status-right "#[fg=#FCFCFC,bg=#31363B] %Y-%m-%d %H:%M "
set -g status-justify left

# Window list styling - inactive windows use gray text
set -g window-status-format "#[fg=#A1A9B1,bg=#31363B] #I:#W "

# Active window uses Breeze blue background (fixes bright green issue)
set -g window-status-current-format "#[fg=#232627,bg=#3DAEE9,bold] #I:#W "

# Window status separator
set -g window-status-separator ""

# Message and command line colors
set -g message-style bg=#3DAEE9,fg=#232627
set -g message-command-style bg=#3DAEE9,fg=#232627

# Copy mode colors
set -g mode-style bg=#3DAEE9,fg=#232627
